{% extends 'layout.html' %}
{% block content %}
<div class="page-header"><h1>Customer Management</h1></div>
<div class="row">
    <div class="col-md-4">
        <div class="card-box">
            <h4>Add Customer</h4>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input class="form-control" name="customer_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input class="form-control" name="phone_number">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="email">
                </div>
                <button class="btn btn-primary" type="submit">Save</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card-box">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Customer List</h4>
                <form method="get" action="{{ url_for('customer_search') }}">
                    <input type="text" name="q" class="form-control" value="{{ search_query or '' }}" placeholder="Search customer">
                </form>
            </div>
            <table class="table table-striped">
                <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
                <tbody>
                    {% for row in rows %}
                    <tr><td>{{ row.customer_id }}</td><td>{{ row.customer_name }}</td><td>{{ row.phone_number or '-' }}</td><td>{{ row.email or '-' }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
